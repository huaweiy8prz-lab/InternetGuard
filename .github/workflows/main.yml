name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Force Java/Kotlin target to 17
        run: |
          cat > "$HOME/force-jvm.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach { task ->
                  if (task.class.name.contains("KotlinCompile")) {
                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug \
            --no-daemon \
            --init-script "$HOME/force-jvm.gradle"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InternetGuard-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
